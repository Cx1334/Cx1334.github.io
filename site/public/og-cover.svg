<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="0.55" stop-color="#131b20" />
      <stop offset="1" stop-color="#16282a" />
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0" r="0.9">
      <stop offset="0" stop-color="#8fc7b8" stop-opacity="0.28" />
      <stop offset="1" stop-color="#8fc7b8" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#dots)" />

  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="238" fill="#8fc7b8" font-size="30" letter-spacing="6">EMBEDDED ENGINEER · 嵌入式工程师</text>
    <text x="70" y="350" fill="#f2f0ea" font-size="92" font-weight="700">小冯</text>
    <text x="72" y="418" fill="#d7d3c8" font-size="34">把设备做稳 · 把链路打通 · 把现场问题定位到根因</text>

    <g font-size="24" fill="#cfe3dc">
      <rect x="72" y="470" width="228" height="56" rx="28" fill="none" stroke="#8fc7b8" stroke-opacity="0.55" />
      <text x="186" y="506" text-anchor="middle">嵌入式 Linux</text>
      <rect x="324" y="470" width="300" height="56" rx="28" fill="none" stroke="#8fc7b8" stroke-opacity="0.55" />
      <text x="474" y="506" text-anchor="middle">工业通信 CAN / Modbus</text>
      <rect x="648" y="470" width="220" height="56" rx="28" fill="none" stroke="#8fc7b8" stroke-opacity="0.55" />
      <text x="758" y="506" text-anchor="middle">边缘计算</text>
    </g>
  </g>
</svg>
